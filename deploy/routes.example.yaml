# Example route table for the gateway.
#
# The two settings that differ from a local run:
#
#   master_key_env  the variable holding the key that may issue and revoke
#                   virtual keys. Agents never receive it.
#   secret_env      "file:/run/secrets/stripe_key" rather than a bare variable
#                   name, because a file can have an owner and a mode. The
#                   gateway refuses to start if that file is group- or
#                   world-readable, or owned by anyone else.
#
# Everything else is a route: a path the agent may call, the upstream it
# reaches, and how risky it is.

master_key_env: SAFETY_MASTER_KEY
session_environment: prod

routes:
  - path: /charge
    upstream: https://api.stripe.com/v1/payment_intents
    action: charge
    risk: destructive
    method: POST
    secret_env: "file:/run/secrets/stripe_key"
    environment: prod

  - path: /lookup
    upstream: https://api.stripe.com/v1/charges
    action: lookup
    risk: read
    method: POST
    environment: prod