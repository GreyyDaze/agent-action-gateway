name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  safety-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: "Mutation check (mutmut full safety-code mutation score)"
        run: |
          python -m mutmut run
          python -m mutmut export-cicd-stats
      - name: Full proof suites (larger job count overnight)
        run: python -m safety_layer.proofs.proof --jobs 1000
      - name: Chaos crash-injection
        run: python -m safety_layer.proofs.chaos --jobs 1000
